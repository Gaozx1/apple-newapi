# pay-oauth2：为 ls-go 用户中心挂载 OAuth 2.0 / OIDC 登录
# 放置位置：/www/server/panel/vhost/nginx/extension/pay/oauth2.conf
# 该目录被站点 vhost 以 include 方式引入（server{} 内部），所以这里写的就是 server 级配置。
#
# 后端：php-fpm 专用 pool [pay-oauth2]，监听 127.0.0.1:9101
#   （本机 nginx 与默认 pool 的 /tmp socket 不在同一挂载命名空间，故走 TCP）

# ---- 在用户中心 SPA 壳里注入 SSO 入口（不改动任何构建产物）----
sub_filter_once on;
sub_filter '</head>' '<script src="/oauth2/assets/config.js"></script><script src="/oauth2/assets/sso.js" defer></script></head>';

location ^~ /oauth2/ {
    fastcgi_pass 127.0.0.1:9101;
    fastcgi_index index.php;
    fastcgi_split_path_info ^(/oauth2)(/.*)$;

    # 显式声明全部 FastCGI 参数，避免与 fastcgi.conf 里 SCRIPT_FILENAME 重复
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE   nginx;
    fastcgi_param REQUEST_METHOD    $request_method;
    fastcgi_param QUERY_STRING      $query_string;
    fastcgi_param REQUEST_URI       $request_uri;
    fastcgi_param SCRIPT_NAME       /oauth2/index.php;
    fastcgi_param SCRIPT_FILENAME   /www/wwwroot/pay-oauth2/index.php;
    fastcgi_param DOCUMENT_ROOT     /www/wwwroot/pay-oauth2;
    fastcgi_param SERVER_PROTOCOL   $server_protocol;
    fastcgi_param SERVER_NAME       $server_name;
    fastcgi_param SERVER_ADDR       $server_addr;
    fastcgi_param SERVER_PORT       $server_port;
    fastcgi_param REMOTE_ADDR       $remote_addr;
    fastcgi_param REMOTE_PORT       $remote_port;
    fastcgi_param CONTENT_TYPE      $content_type;
    fastcgi_param CONTENT_LENGTH    $content_length;
    fastcgi_param HTTPS             $https if_not_empty;
    fastcgi_param REDIRECT_STATUS   200;

    fastcgi_read_timeout 60s;
}
