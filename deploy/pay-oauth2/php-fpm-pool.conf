; pay-oauth2 专用 php-fpm pool
; 放置位置：/www/server/php/81/etc/php-fpm.d/pay-oauth2.conf
; 前置条件：/www/server/php/81/etc/php-fpm.conf 中要有
;   include = /www/server/php/81/etc/php-fpm.d/*.conf
;
; 为什么用 TCP 而不是 unix socket：本机 nginx 与默认 pool 的 /tmp/php-cgi-81.sock
; 不在同一个挂载命名空间（nginx 侧报 connect() ENOENT），TCP 走同一 netns 的 127.0.0.1 稳定可用。

[pay-oauth2]
listen = 127.0.0.1:9101
listen.backlog = 128
listen.allowed_clients = 127.0.0.1
user = www
group = www
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
request_terminate_timeout = 60
catch_workers_output = yes
php_admin_value[error_log] = /www/wwwroot/pay-oauth2/var/php-error.log
php_admin_flag[log_errors] = on
